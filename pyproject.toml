[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prisutnosti"
version = "0.1.0"
description = "CLI tooling for attendance term loading, creation, and verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "selenium>=4.20"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
prisutnosti = "prisutnosti.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
